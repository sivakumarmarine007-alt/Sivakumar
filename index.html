<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Yashwini 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    background:radial-gradient(circle at top,#ffb3c6,#ff758f);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
}

.card{
    background:#fff0f6;
    padding:26px;
    border-radius:22px;
    text-align:center;
    width:92%;
    max-width:360px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    z-index:2;
}

h1{color:#e91e63;margin-bottom:10px}
p{color:#555;font-size:18px}

.buttons{
    margin-top:25px;
    height:130px;
    position:relative;
}

button{
    padding:12px 26px;
    font-size:16px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    position:absolute;
}

#yesBtn{
    background:#e91e63;
    color:white;
    left:50%;
    transform:translateX(-120%);
}

#noBtn{
    background:#ffc1d9;
    color:#333;
    left:50%;
    transform:translateX(10%);
}

.typing{
    white-space:pre-line;
    font-size:17px;
    line-height:1.6;
    min-height:150px;
}

.photo{
    width:100%;
    border-radius:18px;
    margin-top:15px;
    opacity:0;
    transform:scale(.9);
    animation:photoIn 2s forwards;
}

@keyframes photoIn{
    to{opacity:1;transform:scale(1)}
}

.ring{
    font-size:46px;
    margin:12px 0;
    animation:ringPulse 1.5s infinite;
}

@keyframes ringPulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.25)}
    100%{transform:scale(1)}
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<!-- 🎶 Munbe Vaa -->
<audio id="music" loop preload="auto">
    <source src="munbe_vaa.mp3" type="audio/mpeg">
</audio>

<canvas id="fireworks"></canvas>

<div class="card" id="card">
    <h1>Yashwini 💖</h1>
    <p>Will you be my Valentine?</p>

    <div class="buttons">
        <button id="yesBtn">YES 💕</button>
        <button id="noBtn">NO 🙈</button>
    </div>
</div>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const card=document.getElementById("card");
const music=document.getElementById("music");

/* 🧠 TELEPORTING NO BUTTON */
function teleport(){
    noBtn.style.left=Math.random()*(window.innerWidth-120)+"px";
    noBtn.style.top=Math.random()*(window.innerHeight-60)+"px";
}
noBtn.addEventListener("mouseenter",teleport);
noBtn.addEventListener("click",teleport);
noBtn.addEventListener("touchstart",teleport);

/* 🎶 MUSIC FADE-IN */
function playMusic(){
    music.volume=0;
    music.play();
    const fade=setInterval(()=>{
        if(music.volume<0.9) music.volume+=0.02;
        else clearInterval(fade);
    },200);
}

/* ❤️ YES CLICK */
yesBtn.addEventListener("click",()=>{
    playMusic();

    card.innerHTML=`
        <h1>I knew it 💖</h1>
        <div class="ring">💍</div>
        <div class="typing" id="typing"></div>

        <img
            id="finalPhoto"
            class="photo"
            style="display:none"
            src="yash photo.jpg"
            alt="Our Photo ❤️">
    `;

    typeText();
    startFireworks();
});

/* ⌨️ TYPING EFFECT → IMAGE AFTER */
const text=
`Happy Valentine’s Day, Yashwini 🌹

From the moment you came into my life,
everything felt softer… warmer… better.

Every smile of yours feels like home.
Every moment with you is precious.

I choose you.
Today. Tomorrow. Always. ❤️`;

function typeText(){
    const el=document.getElementById("typing");
    const photo=document.getElementById("finalPhoto");
    let i=0;

    const t=setInterval(()=>{
        el.textContent+=text.charAt(i);
        i++;

        if(i>=text.length){
            clearInterval(t);
            setTimeout(()=>{
                photo.style.display="block";
            },700);
        }
    },35);
}

/* 🎆 FIREWORKS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;
let particles=[];

function startFireworks(){
    setInterval(()=>{
        for(let i=0;i<80;i++){
            particles.push({
                x:Math.random()*canvas.width,
                y:Math.random()*canvas.height/2,
                dx:(Math.random()-.5)*6,
                dy:(Math.random()-.5)*6,
                life:80
            });
        }
    },900);
    animate();
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach((p,i)=>{
        ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fill();
        p.x+=p.dx;
        p.y+=p.dy;
        p.life--;
        if(p.life<=0)particles.splice(i,1);
    });
    requestAnimationFrame(animate);
}
</script>

</body>
</html>
